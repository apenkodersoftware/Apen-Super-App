# Nommol Software / Küsten Consultants - portfolio-standard detekt config.
# NOTE: no `formatting:` block here - ktlint owns all formatting rules; detekt only
# covers code smells / complexity / potential-bug rules to avoid the two tools fighting
# over the same lines.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    active: true
    # Generic 80-line default is miscalibrated for single-function-per-screen Jetpack
    # Compose UI (a whole screen is often one composable by convention). 200 still catches
    # genuinely oversized functions; the real fix for Compose-specific structure is the
    # io.nlopez.compose.rules:detekt ruleset staged below for the later hardening pass.
    threshold: 200
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 10
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 30

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true

performance:
  active: true
  SpreadOperator:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true

style:
  active: true
  ForbiddenComment:
    active: false # AI-Studio-scaffold TODOs are expected during the review pass
  MagicNumber:
    active: false # retail/POS domain code is dense with prices/quantities/thresholds
  MaxLineLength:
    active: false # ktlint already enforces line length; avoid double-reporting
  ReturnCount:
    active: true
    max: 4
  UnusedPrivateMember:
    active: true

Compose:
  active: true
  ComposableParamOrder:
    active: true
  ModifierMissing:
    active: true
  MutableParams:
    active: true
  UnstableCollections:
    active: true
